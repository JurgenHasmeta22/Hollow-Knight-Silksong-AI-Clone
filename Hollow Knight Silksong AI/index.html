<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bellweaver</title>
<meta name="description" content="Bellweaver — an original hand-painted 2D action-exploration game.">
<link rel="icon" href="assets/img/props/item_lifethread.webp">
<style>
  @font-face { font-family: 'Cinzel'; src: url('assets/fonts/Cinzel.woff2') format('woff2'); font-weight: 400 900; font-display: block; }
  @font-face { font-family: 'Cormorant Garamond'; src: url('assets/fonts/CormorantGaramond.woff2') format('woff2'); font-weight: 300 700; font-style: normal; font-display: block; }
  @font-face { font-family: 'Cormorant Garamond'; src: url('assets/fonts/CormorantGaramond-Italic.woff2') format('woff2'); font-weight: 300 700; font-style: italic; font-display: block; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; outline: none; background: #000; }
  #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    color: #e9dfca; font-family: 'Cinzel', serif; letter-spacing: 0.3em; font-size: 22px; background: #05080a; }
  #loading .track { width: 260px; height: 2px; background: rgba(233,223,202,0.2); }
  #loading-bar { width: 0; height: 100%; background: #f1d7a0; transition: width 0.2s; }
  #loading small { font-family: 'Cormorant Garamond', serif; letter-spacing: 0.05em; font-size: 16px; opacity: 0.6; }
</style>
</head>

<canvas id="game" tabindex="0"></canvas>
<div id="loading">BELLWEAVER<div class="track"><div id="loading-bar"></div></div><small>gathering thread…</small></div>
