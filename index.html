<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>The Uncalled</title>
        <meta name="description" content="The Uncalled — an original hand-painted 2D action-exploration game." />
        <link rel="icon" href="assets/img/props/item_lifethread.webp" />
        <style>
            @font-face {
                font-family: 'Cinzel';
                src: url('assets/fonts/Cinzel.woff2') format('woff2');
                font-weight: 400 900;
                font-display: block;
            }
            @font-face {
                font-family: 'Cormorant Garamond';
                src: url('assets/fonts/CormorantGaramond.woff2') format('woff2');
                font-weight: 300 700;
                font-style: normal;
                font-display: block;
            }
            @font-face {
                font-family: 'Cormorant Garamond';
                src: url('assets/fonts/CormorantGaramond-Italic.woff2') format('woff2');
                font-weight: 300 700;
                font-style: italic;
                font-display: block;
            }
            html,
            body {
                margin: 0;
                height: 100%;
                background: #000;
                overflow: hidden;
            }
            body {
                display: flex;
                align-items: center;
                justify-content: center;
            }
            canvas {
                display: block;
                outline: none;
                background: #000;
            }
            #loading {
                position: fixed;
                inset: 0;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 18px;
                color: #e9dfca;
                font-family: 'Cinzel', serif;
                letter-spacing: 0.3em;
                font-size: 22px;
                background: #05080a;
            }
            #loading .track {
                width: 260px;
                height: 2px;
                background: rgba(233, 223, 202, 0.2);
            }
            #loading-bar {
                width: 0;
                height: 100%;
                background: #f1d7a0;
                transition: width 0.2s;
            }
            #loading small {
                font-family: 'Cormorant Garamond', serif;
                letter-spacing: 0.05em;
                font-size: 16px;
                opacity: 0.6;
            }
        </style>
    </head>
    <body>
        <canvas id="game" tabindex="0"></canvas>
        <div id="loading">
            BELLWEAVER
            <div class="track"><div id="loading-bar"></div></div>
            <small>gathering thread…</small>
        </div>
        <script src="assets/manifest.js"></script>
        <script src="assets/audio/music.js"></script>
        <script src="assets/audio/sfx_pack.js"></script>
        <script src="assets/audio/sfx_bank.js"></script>
        <script src="src/core/core.js"></script>
        <script src="src/input/input.js"></script>
        <script src="src/audio/audio.js"></script>
        <script src="src/save/save.js"></script>
        <script src="src/rendering/graphics.js"></script>
        <script src="src/rendering/assets.js"></script>
        <script src="src/world/world.js"></script>
        <script src="src/world/rooms.js"></script>
        <script src="src/world/fortress.js"></script>
        <script src="src/world/hushed.js"></script>
        <script src="src/world/hushed_wings.js"></script>
        <script src="src/rendering/fx.js"></script>
        <script src="src/entities/player.js"></script>
        <script src="src/progression/difficulty.js"></script>
        <script src="src/progression/xp.js"></script>
        <script src="src/entities/enemies.js"></script>
        <script src="src/entities/objects.js"></script>
        <script src="src/entities/ronin.js"></script>
        <script src="src/entities/boss.js"></script>
        <script src="src/entities/mourner.js"></script>
        <script src="src/entities/hushed.js"></script>
        <script src="src/progression/codex.js"></script>
        <script src="src/progression/lore.js"></script>
        <script src="src/progression/hushed.js"></script>
        <script src="src/progression/lore_ronin.js"></script>
        <script src="src/rendering/terrain.js"></script>
        <script src="src/rendering/background.js"></script>
        <script src="src/ui/hud.js"></script>
        <script src="src/input/glyphs.js"></script>
        <script src="src/ui/menus.js"></script>
        <script src="src/ui/guide.js"></script>
        <script src="src/ui/map.js"></script>
        <script src="src/ui/slots.js"></script>
        <script src="src/save/testsaves.js"></script>
        <script src="src/game/game.js"></script>
        <script src="src/game/levels/cathedral.js"></script>
        <script src="src/game/levels/hushed.js"></script>
        <script src="src/ui/gallery.js"></script>
        <script src="src/core/main.js"></script>
    </body>
</html>
